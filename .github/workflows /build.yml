name: Minimal Bootstrap | EXT4 Builtin, All Others Dynamic
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex libssl-dev bc cpio gzip wget xz-utils libelf-dev dwarves kmod rsync

      - name: Fetch Linux 6.6.60
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.60.tar.xz
          tar -xf linux-6.6.60.tar.xz
          cd linux-6.6.60
          cp ../kernel.config .config

      - name: Build kernel + all modules
        run: |
          cd linux-6.6.60
          make olddefconfig
          make -j$(nproc) bzImage modules

      - name: Build full driver package
        run: |
          cd linux-6.6.60
          mkdir -p ../out/full/lib/modules
          make INSTALL_MOD_PATH=../out/full modules_install
          find ../out/full -name "*.ko" -exec strip --strip-debug {} \;
          cd ../out/full
          tar -zcf ../full-drivers.tar.gz lib

      - name: Build minimal driver package
        run: |
          cd out
          rm -rf minimal
          mkdir -p minimal/lib/modules
          VER=$(ls full/lib/modules/)
          mkdir -p minimal/lib/modules/$VER
          KELIST=(
            kernel/drivers/net/ethernet/intel/e1000/e1000.ko
            kernel/drivers/net/ethernet/intel/e1000e/e1000e.ko
            kernel/drivers/net/ethernet/realtek/r8169/r8169.ko
            kernel/drivers/net/ethernet/realtek/r8125/r8125.ko
          )
          for f in "${KELIST[@]}"; do
            src="full/lib/modules/$VER/$f"
            dst="minimal/lib/modules/$VER/$f"
            [ -f "$src" ] && { mkdir -p $(dirname "$dst"); cp "$src" "$dst"; }
          done
          cd minimal
          tar -zcf ../minimal-drivers.tar.gz lib

      - name: Prepare busybox
        run: |
          wget -O busybox-mini https://busybox.net/downloads/binaries/1.36.1-x86_64-linux-musl/busybox
          chmod +x busybox-mini
          wget -O busybox-full https://busybox.net/downloads/binaries/1.36.1-x86_64-linux-musl/busybox
          chmod +x busybox-full
          mv busybox-mini out/
          mv busybox-full out/

      - name: Build tiny initramfs
        run: |
          chmod +x mkinit.sh
          ./mkinit.sh

      - name: Copy bzImage
        run: |
          cp linux-6.6.60/arch/x86_64/boot/bzImage out/

      - name: Archive all artifacts
        run: |
          cd out
          zip -r ../minimal-ext4-builtin.zip \
            bzImage \
            initramfs.cpio.gz \
            minimal-drivers.tar.gz \
            full-drivers.tar.gz \
            busybox-full

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: minimal-ext4-builtin-release
          path: minimal-ext4-builtin.zip
