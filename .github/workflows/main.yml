name: Build Minimal Linux
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex libssl-dev bc cpio \
            fdisk dosfstools mtools systemd-boot busybox-static rsync libelf-dev  sfdisk dosfstools e2fsprogs grub-pc-bin grub-efi-amd64-bin

      - name: Download Linux 6.6.60
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.60.tar.xz
          tar -xf linux-6.6.60.tar.xz
          cd linux-6.6.60
          make defconfig
          make -j$(nproc) bzImage

      - name: Copy kernel
        run: |
          cp linux-6.6.60/arch/x86_64/boot/bzImage ./bzImage

      - name: Build initramfs
        run: |
          chmod +x mkinit.sh
          ./mkinit.sh

      - name: Build bootable disk image
        run: |
          chmod +x mkimg.sh
          ./mkimg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootimg
          path: bootable-disk.img
